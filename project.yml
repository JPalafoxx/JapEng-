name: SuwanTranslate
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '2'
    APP_BUNDLE_ID: com.yourname.suwan
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    VERSIONING_SYSTEM: apple-generic
    CODE_SIGN_STYLE: Manual
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  SuwanTranslate:
    type: application
    platform: iOS
    sources: [App, Shared]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Suwan Translate
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        AppGroup: group.$(APP_BUNDLE_ID)
        KeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
        BroadcastBundle: $(APP_BUNDLE_ID).broadcast
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: Broadcast
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    info:
      path: Broadcast/Info.plist
      properties:
        CFBundleDisplayName: Suwan Audio
        AppGroup: group.$(APP_BUNDLE_ID)
        KeychainGroup: $(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Broadcast/Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [group.$(APP_BUNDLE_ID)]
        keychain-access-groups: [$(AppIdentifierPrefix)$(APP_BUNDLE_ID).shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).broadcast
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
schemes:
  SuwanTranslate:
    build:
      targets:
        SuwanTranslate: all
