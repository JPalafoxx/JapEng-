# Revision 2: corrected PiP skip callback to match the Xcode protocol.
# Upload only this file to your GitHub repository. Source is embedded, not secret.
# Run compile-check first. For TestFlight, replace BOTH com.yourname.suwan values below.
workflows:
  compile-check:
    name: Suwan - compile check (no Apple membership needed)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
    - &id001
      name: Extract bundled source and generate project
      script: |
        set -euo pipefail
        python3 - <<'PYCODE'
        import base64, hashlib, io, os, pathlib, zipfile
        payload = base64.b64decode("""""")
        assert hashlib.sha256(payload).hexdigest() == "ce6ec2291b2112213ceb7f4c5777107cdef4e45a1cdd1002bf8306a9a0f8b55e", "Source checksum mismatch"
        root = pathlib.Path("SuwanTranslate")
        root.mkdir(exist_ok=True)
        with zipfile.ZipFile(io.BytesIO(payload)) as archive:
            for item in archive.infolist():
                path = pathlib.PurePosixPath(item.filename)
                if path.is_absolute() or ".." in path.parts:
                    raise SystemExit("Unsafe source path")
            archive.extractall(root)
        bundle = os.environ.get("APP_BUNDLE_ID", "com.yourname.suwan")
        p = root / "project.yml"
        p.write_text(p.read_text().replace("com.yourname.suwan", bundle))
        print("Source extracted; SHA-256 verified")
        PYCODE
        cd SuwanTranslate
        command -v xcodegen >/dev/null || brew install xcodegen
        xcodegen generate
    - name: Compile app and broadcast extension
      script: |
        cd SuwanTranslate
        set -euo pipefail
        xcodebuild -project SuwanTranslate.xcodeproj -scheme SuwanTranslate -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
    artifacts:
    - SuwanTranslate/build/Logs/Build/*.xcactivitylog
  testflight:
    name: Suwan - signed TestFlight build
    instance_type: mac_mini_m2
    max_build_duration: 40
    integrations:
      app_store_connect: suwan-apple
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.suwan
      vars:
        APP_BUNDLE_ID: com.yourname.suwan
    scripts:
    - *id001
    - name: Check signing setup and generate build number
      script: |
        set -euo pipefail
        cd SuwanTranslate
        python3 ci/preflight.py
        BUILD_NUMBER=$(date -u +%Y%m%d%H%M)
        agvtool new-version -all "$BUILD_NUMBER"
    - name: Apply signing profiles
      script: |
        cd SuwanTranslate
        set -euo pipefail
        xcode-project use-profiles
    - name: Build installable archive
      script: |
        cd SuwanTranslate
        set -euo pipefail
        xcode-project build-ipa --project SuwanTranslate.xcodeproj --scheme SuwanTranslate
    artifacts:
    - SuwanTranslate/build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
